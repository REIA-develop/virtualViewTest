<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>仮想テーブルテスト</title>
	
	
	<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
	<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery.tablesorter/2.31.0/js/jquery.tablesorter.min.js"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery.tablesorter/2.31.0/css/theme.default.min.css">
	
	<script type="text/javascript" src="/index.js?v=1"></script>
	<script type="text/javascript" src="/VirtualTable.js?v=1" ></script>
	
	<style>
		body{
			overflow: hidden;
		}
		tr[data-is-even='true']{
			filter:brightness(0.5);
		}
		tr>*{
			background:white;
			border : 1px solid black;
			width: 50px;
		}
		
		table{
			border: 1px solid black;
			border-collapse:  collapse;
		}
		.form{
			height : 10vh;
		}
		.table-area{
			height : 85vh;
			overflow-x: scroll;
			overflow-y: scroll;
		}
		virtual-table{
			display: flex;
			flex-direction: column;
		}
	</style>
</head>
<body>
	<div id="code"></div>
	<div class="form">
		<label>
			<input class="rowCnt" type="number" min="1" value="2">
			行
		</label>
		<label>
			<input class="colCnt" type="number" min="1" value="13">
			列
		</label>
		<button type="button" class="createUI">テーブルを作成</button>
	</div>
	<div class="table-area">

	</div>
</body>
</html>
